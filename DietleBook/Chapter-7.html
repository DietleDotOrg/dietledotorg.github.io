style='font-size:12.0pt'>Sadie Naomi Dietle</span></b></p>

<p class=MsoNormal align=center style='text-align:center'><b><span
style='font-size:4.0pt'>&nbsp;</span></b></p>

<p class=MsoNormal style='text-align:justify'>Sadie Naomi Dietle, daughter of
Adam Dietle and Susan (Werner) Dietle, married Millard<span style='font-size:
8.0pt;font-family:"Helvetica",sans-serif;position:relative;top:-3.0pt'>2,12b,101,131a,270
</span>E.<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'>270</span> Steinly<span style='font-size:8.0pt;
font-family:"Helvetica",sans-serif;position:relative;top:-3.0pt'>
12b,101,131a,270</span> or Steinley<span style='font-size:8.0pt;font-family:
"Helvetica",sans-serif;position:relative;top:-3.0pt'>2</span>. Dad recalls her
as a calm, easy going person<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'> 53</span>. She was born on March 21<span
style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'>132,270</span>, 1890<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'>132,270,315</span> and died intestate<span
style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'>335</span> on Nov. 12<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'>132,270</span>, 1955<span style='font-size:8.0pt;
font-family:"Helvetica",sans-serif;position:relative;top:-3.0pt'>132,315</span> at
her home<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'>270</span>. Millard was born on March 22<span
style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'>71a</span>, 1886<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'>71a,315</span> and died in Jan. 1957<span
style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'> 71a</span> or on Nov. 26<span style='font-size:8.0pt;font-family:
"Helvetica",sans-serif;position:relative;top:-3.0pt'>132</span>, 1956<span
style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'> 132,315</span>. Sadie and Millard were farmers who lived close to
(but possibly not in) Greenville Township<span style='font-size:8.0pt;
font-family:"Helvetica",sans-serif;position:relative;top:-3.0pt'> 53</span>.
They were affiliated with the Reformed Church at Pocahontas in Greenville Twp<span
style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'>53,465</span>. The church is (1993) no longer there<span
style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'> 53</span>. Sadie and Millard are buried side by side in the
Greenville Union Cemetery<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'>315</span>. She and Millard had the following
children:</p>

<p class=MsoNormal style='text-align:justify'><span style='font-size:4.0pt'>&nbsp;</span></p>

<p class=MsoNormal style='margin-left:.25in'>Ralph<span style='font-size:8.0pt;
font-family:"Helvetica",sans-serif;position:relative;top:-3.0pt'>2,71a,270,291,335</span> Millard<span
style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'>71a</span> Steinly<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'>71a,270,335</span>, born June 17, 1911<span
style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'> 2,71a</span>, died approximately in late 1995<span
style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'>462</span>,</p>

<p class=MsoNormal style='margin-left:.25in'>Rosella<span style='font-size:

<p class=MsoNormal style='margin-left:.25in'><span style='font-size:4.0pt'>&nbsp;</span></p>

<p class=MsoNormal style='margin-left:.25in;text-align:justify'>Ralph Steinly,
son of Millard Steinly and Sadie Naomi (Dietle) Steinly, married Lenora<span
style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'>2,12b,131a </span>or Elnora<span style='font-size:8.0pt;font-family:
"Helvetica",sans-serif;position:relative;top:-3.0pt'> 132,315,462</span> McKenzie<span
style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'> 2,12b,131a</span>. She was born on Dec. 18<span style='font-size:
8.0pt;font-family:"Helvetica",sans-serif;position:relative;top:-3.0pt'>255</span>,
1909<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:
relative;top:-3.0pt'>255,315</span> in Greenville Twp.<span style='font-size:
8.0pt;font-family:"Helvetica",sans-serif;position:relative;top:-3.0pt'>255</span> and
died July 2, 1970<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'> 71b,131b,132,255</span>. She is buried in the
Greenville Cemetery<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'>255</span>. Ralph was born in 1911, and was
apparently still living in 1994<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'>315</span>.</p>

<p class=MsoNormal style='margin-left:.25in;text-align:justify'><span
style='font-size:4.0pt'>&nbsp;</span></p>

<p class=MsoNormal style='margin-left:.25in;text-align:justify'>Dad recalls
that before Ralph Steinley got married (and possibly after) he worked on
Grandpa Irvin H. Dietle s farm in the springtime (before the boys got out of
school for the summer) to help with the spring plowing and getting the fields
ready to plant<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'> 135</span>. Dad also remembers that when Grandpa
Irvin H. Dietle traded in his 1936 Chevy for a new 1940 Chevy, Ralph bought the
1936 Chevy from the dealership<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'> 135</span>. In his mother s obituary, Ralph s
residence was given as Meyersdale RD 3<span style='font-size:8.0pt;font-family:
"Helvetica",sans-serif;position:relative;top:-3.0pt'>270</span>. Ralph and
Lenora had the following children:</p>

<p class=MsoNormal style='margin-left:.25in;text-align:justify'><span
style='font-size:4.0pt'>&nbsp;</span></p>

<p class=MsoNormal style='margin-left:.5in'>a son born and died Oct. 15<span
style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'>2,71a</span>, 1938<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'> 2,71a,315</span>,</p>

<p class=MsoNormal style='margin-left:.25in;text-align:justify'>Rosella

position:relative;top:-3.0pt'> 2,12b,71a,465</span>. In her mother s obituary,

"Helvetica",sans-serif;position:relative;top:-3.0pt'>270</span>, which is in

style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'>465</span>. He also had a farm<span style='font-size:8.0pt;
font-family:"Helvetica",sans-serif;position:relative;top:-3.0pt'>465</span>.
James died on May 5, 1974<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'> 71b</span>. Several years after James died,
Rosella married Lewis<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'>23.438,465</span> Eli<span style='font-size:8.0pt;
font-family:"Helvetica",sans-serif;position:relative;top:-3.0pt'>438 </span>Shockey<span
style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'>23,438,465</span> Sr.<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;

In her mother s obituary, her residence was given as Meyersdale RD 3<span
style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'>270</span>. The Somerset C. Deed Index<span style='font-size:8.0pt;

buried in the Meyersdale Union Cemetery<span style='font-size:8.0pt;font-family:
"Helvetica",sans-serif;position:relative;top:-3.0pt'>462</span>. Lawrence
Jackson is (1996) living in the Meyersdale area<span style='font-size:8.0pt;
font-family:"Helvetica",sans-serif;position:relative;top:-3.0pt'>462</span>.

top:-3.0pt'> 2,12b,71a</span>, David Lawrence Jackson<span style='font-size:
8.0pt;font-family:"Helvetica",sans-serif;position:relative;top:-3.0pt'>12b,71a</span>,
born June 13, 1944<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'> 2,12b,71a</span>.</p>

<p class=MsoNormal style='margin-left:.5in'><span style='font-size:4.0pt'>&nbsp;</span></p>

<p class=MsoNormal style='margin-left:.5in;text-align:justify'>Marian Marie
Jackson, daughter of Lawrence Jackson and Velma (Steinly) Jackson, married
David<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'>2,12b,247</span> Corliss<span style='font-size:
8.0pt;font-family:"Helvetica",sans-serif;position:relative;top:-3.0pt'>247</span> Sutton<span
style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'> 2,12b,12b,247</span>, son of Mr. &amp; Mrs. William E. Sutton, Sr.
of Keysor, West Virginia<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'>247</span>. Marian and David were married on Oct.
14, 19__ at the Hostetler Church of the Brethern<span style='font-size:8.0pt;
font-family:"Helvetica",sans-serif;position:relative;top:-3.0pt'>247</span>.
Marion graduated from the Meyersdale Joint High School in 1958, and later
graduated from the Cumberland Memorial School of Nursing<span style='font-size:
8.0pt;font-family:"Helvetica",sans-serif;position:relative;top:-3.0pt'>247</span>.
David graduated from the Fort Ashby High School, and served 4 years in the U.S.
Air Force<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'>247</span>. He was employed by the Western
Maryland Railroad at the time of their marriage<span style='font-size:8.0pt;
font-family:"Helvetica",sans-serif;position:relative;top:-3.0pt'>247</span>.
Marian s father reported in 1996 that Marian is employed as a visiting Nurse
out of Cumberland, and David works at the West Vaco paper mill<span
style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'>465</span>. The newspaper announcement of their wedding indicated
that they planned to reside in Cumberland<span style='font-size:8.0pt;
font-family:"Helvetica",sans-serif;position:relative;top:-3.0pt'>247</span>.
Marian and David had the following children:</p>

<p class=MsoNormal style='margin-left:.5in;text-align:justify'><span
style='font-size:4.0pt'>&nbsp;</span></p>

<p class=MsoNormal style='margin-left:.75in'>Lois Marie Sutton, born June 30,
1963<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:
relative;top:-3.0pt'> 2,12b,71a,131b</span>, who married ___ Spencer<span
style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'>465</span>, </p>

<p class=MsoNormal style='margin-left:.75in'>Janet Susan Sutton, born Oct. 17,
1964<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:
relative;top:-3.0pt'> 2,12b,131b</span>, who married ____ Merschat<span
style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'>465</span>,</p>

<p class=MsoNormal style='margin-left:.75in'>Nancy<span style='font-size:8.0pt;
font-family:"Helvetica",sans-serif;position:relative;top:-3.0pt'> 71a,465</span> 
Sutton<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'> 71a</span> , born Sept. 1966<span
style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'> 71a</span> ,  and</p>

<p class=MsoNormal style='margin-left:.75in'>Willy<span style='font-size:8.0pt;
font-family:"Helvetica",sans-serif;position:relative;top:-3.0pt'>465</span>,  
who is (1996) in the service<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'>465</span>.</p>

<p class=MsoNormal style='margin-left:.75in'><span style='font-size:4.0pt'>&nbsp;</span></p>

<p class=MsoNormal style='margin-left:.75in'><span style='font-size:4.0pt'>&nbsp;</span></p>

style='page-break-before:always'>
</span>

<p class=MsoNormal align=center style='text-align:center'><span
style='font-size:9.0pt;font-family:"Helvetica",sans-serif'><img width=166
height=218 src="Chapter-7_files/image001.jpg"></span></p>

<p class=MsoNormal align=center style='text-align:center'><span
style='font-size:4.0pt;font-family:"Helvetica",sans-serif'>&nbsp;</span></p>

<p class=MsoNormal align=center style='text-align:center'><span
style='font-size:9.0pt;font-family:"Helvetica",sans-serif'>David Lawrence
Jackson, 1993</span></p>

<p class=MsoNormal style='margin-left:.5in;text-align:justify'>&nbsp;</p>

<p class=MsoNormal style='margin-left:.5in;text-align:justify'>David Lawrence
Jackson, son of Lawrence Jackson and Velma (Steinly) Jackson, married Linda<span
style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'> 2,12b</span> or Lynda<span style='font-size:8.0pt;font-family:
"Helvetica",sans-serif;position:relative;top:-3.0pt'> 71a</span> Baker. David
Lawrence Jackson is (1996) the present owner of the old Dietle farm which was
once the residence of Adam Dietle and his wife Susan (Werner) Dietle<span
style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'> 135,462</span>. After Adam, the farm went to Lloyd Dietle<span
style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'>465</span>. When Lloyd died, the farm went to John and Bertha
Dietle, then Lawrence Jackson, then David Jackson<span style='font-size:8.0pt;
font-family:"Helvetica",sans-serif;position:relative;top:-3.0pt'>465</span>.
David reports that the old foundation on his place was that of an old log cabin
or house that he had to take down because of it s poor condition<span
style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'>462</span>.  Neither he nor his father know the history of the log
house or cabin<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'>462,465</span>. David and Linda had the following
children:</p>

<p class=MsoNormal style='margin-left:.5in;text-align:justify'><span
style='font-size:4.0pt'>&nbsp;</span></p>

<p class=MsoNormal style='margin-left:.75in'>Duane David<span style='font-size:
8.0pt;font-family:"Helvetica",sans-serif;position:relative;top:-3.0pt'>
2,12b,131b,463</span> <a href="#_ftn1" name="_ftnref1" title=""><span
class=MsoFootnoteReference><span style='font-size:8.0pt'>**</span></span></a><span
style='font-size:9.0pt'> </span> Jackson, born April 16, 1966<span
style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'>2,12b,71a,131b,462</span> , and</p>

<p class=MsoNormal style='margin-left:.75in'>Gary<span style='font-size:8.0pt;
font-family:"Helvetica",sans-serif;position:relative;top:-3.0pt'>71a,462</span> Eugene<span
style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'>71a</span>  Jackson<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'>71a</span>, born July 24, 1968<span
style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'> 71a, 462</span>.</p>

<p class=MsoNormal style='margin-left:.5in;text-align:justify'><span
style='font-size:4.0pt'>&nbsp;</span></p>

<p class=MsoNormal style='margin-left:.75in;text-align:justify'>Duane Jackson,
son of David Jackson and Linda (Baker) Jackson was married, but is now (1996)
divorced<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'>462</span>. Duane lives in Meyersdale, and works
at Gilmore s in Somerset, which makes garden hose and fittings<span
style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'>462</span>.  His children are<span style='font-size:8.0pt;
font-family:"Helvetica",sans-serif;position:relative;top:-3.0pt'>462</span>:</p>

<p class=MsoNormal style='margin-left:.5in;text-align:justify'><span
style='font-size:4.0pt'>&nbsp;</span></p>

<p class=MsoNormal style='margin-left:1.0in'>Derick Jackson, and</p>

<p class=MsoNormal style='margin-left:1.0in'>Shayla Jackson.</p>

<p class=MsoNormal style='margin-left:.5in;text-align:justify'><span
style='font-size:4.0pt'>&nbsp;</span></p>

<p class=MsoNormal style='margin-left:.75in;text-align:justify'>Gary Jackson,
son of David Jackson and Linda (Baker) Jackson was married, but is now (1996)
divorced<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'>462</span>. Gary is (1996) a diesel mechanic at
Furlow s in Cumberland. He is (1996) living at home with David and Linda.</p>

<p class=MsoNormal style='margin-left:.75in'>&nbsp;</p>

<p class=MsoNormal style='margin-left:1.0in'>&nbsp;</p>

<p class=MsoNormal align=center style='text-align:center'><b><span
style='font-size:12.0pt'>John Milton Dietle</span></b></p>

<p class=MsoNormal align=center style='text-align:center'><b><span
style='font-size:4.0pt'>&nbsp;</span></b></p>

<p class=MsoNormal style='text-align:justify'>John Milton Dietle, son of Adam
Dietle and Susan (Werner) Dietle, married Bertha<span style='font-size:8.0pt;
font-family:"Helvetica",sans-serif;position:relative;top:-3.0pt'>2,12b,62,101,131a,268</span> Naomi<span
style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'>268</span> Steinley<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'>2,12b,101,131a,</span> or Steinly<span
style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'>268</span>, daughter of Lewis<span style='font-size:8.0pt;
font-family:"Helvetica",sans-serif;position:relative;top:-3.0pt'>35,268</span> and
Susan<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'>35</span> or Susannah<span style='font-size:8.0pt;
font-family:"Helvetica",sans-serif;position:relative;top:-3.0pt'>62,268</span> (Housel<span
style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'>35,62,268</span>) Steinley<span style='font-size:8.0pt;font-family:
"Helvetica",sans-serif;position:relative;top:-3.0pt'>35</span> or Steinly<span
style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'>62,268</span>. Bertha<a href="#_ftn2" name="_ftnref2" title=""><span
class=MsoFootnoteReference><span style='font-size:8.0pt'>*</span></span></a>
was born on April 11, 1892<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'>62</span>. She has a brother named Millard<span
style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'>62</span> who married John Milton Dietle s sister Sadie Naomi
Dietle. </p>

<p class=MsoNormal style='text-align:justify'><span style='font-size:4.0pt'>&nbsp;</span></p>

<p class=MsoNormal style='text-align:justify'>John worked some in timber,
enjoyed hunting, and was a member of the Greenville Lutheran Church<span
style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'> 53</span>. The 1920 census lists him as a Farmer living in
Greenville Twp with his wife Bertha and son Carl (sic) and daughter Dorthy<span
style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'> 54</span>. The census indicates he owned his farm free and clear
in 1920<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'> 54</span>. His address was R.F.D. #1, Sand
Patch, PA in 1927<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'>394</span>. </p>

<p class=MsoNormal style='text-align:justify'>&nbsp;</p>

<p class=MsoNormal align=center style='text-align:center'><img width=550
height=331 src="Chapter-7_files/image002.jpg"></p>

<p class=MsoNormal align=center style='text-align:center'><span
style='font-size:4.0pt'>&nbsp;</span></p>

<p class=MsoNormal align=center style='text-align:center'><span
style='font-size:9.0pt;font-family:"Helvetica",sans-serif'>John Dietle and
Bertha (Steinley) Dietle</span></p>

<p class=MsoNormal align=center style='text-align:center'>&nbsp;</p>

<p class=MsoNormal align=center style='text-align:center'><span
style='font-size:9.0pt;font-family:"Helvetica",sans-serif'>&nbsp;</span></p>

<p class=MsoNormal align=center style='text-align:center'><span
style='font-size:9.0pt;font-family:"Helvetica",sans-serif'>&nbsp;</span></p>

<p class=MsoNormal align=center style='text-align:center'><span
style='font-size:9.0pt;font-family:"Helvetica",sans-serif'><img width=472
height=331 src="Chapter-7_files/image003.jpg"></span></p>

<p class=MsoNormal align=center style='text-align:center'><span
style='font-size:4.0pt;font-family:"Helvetica",sans-serif'>&nbsp;</span></p>

<p class=MsoNormal align=center style='text-align:center'><span
style='font-size:9.0pt;font-family:"Helvetica",sans-serif'>The John Milton
Dietle family, L to R: Bertha, Hubert, Carl, Dorthy, John. </span></p>

<p class=MsoNormal align=center style='text-align:center'><span
style='font-size:9.0pt;font-family:"Helvetica",sans-serif'>(Courtesy of Ralph
Dietle from Irvin Dietle, Sr. papers)</span></p>

<p class=MsoNormal style='text-align:justify'>&nbsp;</p>

<p class=MsoNormal style='text-align:justify'><span style='font-size:4.0pt'>&nbsp;</span></p>

<p class=MsoNormal style='text-align:justify'>Dad recalls that John was a jolly
sort, always joking, and that John and his brother Irvin liked to kid each
other. Some time after Irvin and John had aged enough to require glasses, John
also had to get false teeth and was having a rough time with them. Irvin kidded
him by saying it wasn t so bad for someone to have to get glasses, but when you
had to have glasses <i>and</i> false teeth, well, that was pretty bad! Of
course, eventually Grandpa had to get false teeth too. John told a funny story
about driving home after getting his first pair of bi-focals, saying he saw two
bridges instead of one, and didn t know which one to take.</p>

<p class=MsoNormal style='text-align:justify'><span style='font-size:4.0pt'>&nbsp;</span></p>

<p class=MsoNormal style='text-align:justify'>Bertha was born on April 11, 1892<span
style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'>249,268</span> in Greenville Twp.<span style='font-size:8.0pt;
font-family:"Helvetica",sans-serif;position:relative;top:-3.0pt'>268</span> and
died on Dec. 7, 1969<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'> 71b,132,249 </span>in Mt. Holly, NJ<span
style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'>268</span>. She is buried at the Greenville Cemetery<span
style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'>249,268</span>. John and Bertha had a big farm down the road from
the farm once owned by John s father Adam, then later by John s brother Lloyd<span
style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'>465</span>. This farm did border at least partially on his father s
farm<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:
relative;top:-3.0pt'>465</span>. After Lloyd died, John and Bertha got the
farm, and eventually sold it to Lawrence Jackson<span style='font-size:8.0pt;
font-family:"Helvetica",sans-serif;position:relative;top:-3.0pt'>465</span>.
John died intestate<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'>335</span>. John and Bertha had the following
children:</p>

<p class=MsoNormal style='text-align:justify'><span style='font-size:4.0pt'>&nbsp;</span></p>

<p class=MsoNormal style='margin-left:.25in'>Karl<span style='font-size:8.0pt;
font-family:"Helvetica",sans-serif;position:relative;top:-3.0pt'> 53,335</span> or
Carl <span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'>2,71a,291 </span>Dietle<span style='font-size:
8.0pt;font-family:"Helvetica",sans-serif;position:relative;top:-3.0pt'>2,335</span>,
born March 9, 1914<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'> 12b,131a</span>, </p>

<p class=MsoNormal style='margin-left:.25in'>Dorothy<span style='font-size:
8.0pt;font-family:"Helvetica",sans-serif;position:relative;top:-3.0pt'>2</span> or
Dorthy<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'>12b,131a,262,291</span> A.<span style='font-size:
8.0pt;font-family:"Helvetica",sans-serif;position:relative;top:-3.0pt'>262 </span>Dietle<span
style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'>2,12b,131a,262</span>, born June 1<span style='font-size:8.0pt;
font-family:"Helvetica",sans-serif;position:relative;top:-3.0pt'>12b,131a</span>,
1917<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:
relative;top:-3.0pt'> 12b,131a,315</span>, and</p>

<p class=MsoNormal style='margin-left:.25in'>Hubert<span style='font-size:8.0pt;
font-family:"Helvetica",sans-serif;position:relative;top:-3.0pt'>2,12b,131a,291</span> A.
<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'>2,12b,131a </span>or Herbert A. <span style='font-size:8.0pt;
font-family:"Helvetica",sans-serif;position:relative;top:-3.0pt'>71b </span>Dietle,
born June 23, 1923, </p>

<p class=MsoNormal style='margin-left:.25in'>and died in 1932<span
style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'> 2,12b,71a</span>.</p>

<p class=MsoNormal style='margin-left:.25in'><span style='font-size:4.0pt'>&nbsp;</span></p>

<p class=MsoNormal style='margin-left:.25in;text-align:justify'>Dorthy Dietle,
daughter of John Dietle and Bertha (Steinley) Dietle, married the Rev. Ralph<span
style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'>2,53,131a,262</span> I.<span style='font-size:8.0pt;font-family:
"Helvetica",sans-serif;position:relative;top:-3.0pt'>262 </span>Shockey<span
style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'> 2,53,131a,262</span>, who was a Lutheran minister<span
style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'> 53</span>. They were married at the Greenville Lutheran Church on
Easter Sunday, April 9, 19__<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'>262</span>. Ralph was born in 1915<span
style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'>315</span>. His parents were Mr. &amp; Mrs. Irvin Shockey of
Meyersdale<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'> 262</span>. Ralph graduated from the Meyersdale
High School in 1932, and in 1936 received an A.B. from Susquehanna University<span
style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'>262</span>. Their wedding announcement stated that Ralph was
scheduled to graduate from the Lutheran Theological Cemetery in Gettysburg in
the month following the wedding<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'>262</span>. In 1938 Dorothy graduated from the
Lutheran Deaconness Training School with special classes in Christian Service<span
style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'>262</span>.</p>

<p class=MsoNormal style='margin-left:.25in;text-align:justify'><span
style='font-size:4.0pt'>&nbsp;</span></p>

<p class=MsoNormal style='margin-left:.25in;text-align:justify'>Ralph s first
charge was at Winber, PA<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'> 135</span>. Dorthy and Ralph eventually went to
live in the New Jersey area<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'> 53</span>. In Grandma Dietle s notebook, his
address was listed as Moorestown, NJ<span style='font-size:8.0pt;font-family:
"Helvetica",sans-serif;position:relative;top:-3.0pt'> 132</span>, and in
Dorthy s mother s 1969 obituary, Dorthy s residence was also given as
Moorestown<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'>268</span>. Grandpa Dietle always thought very
highly of Ralph Shockey, and named one of his own sons Ralph in his honor<span
style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'> 135</span>. Dad recalls that Ralph once owned a 1949 Buick Road
Master; this was a large luxury car, and left a lasting impression with dad<span
style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'>135</span>. Dorthy and Ralph had the following children<span
style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'> 12b</span>:</p>

<p class=MsoNormal style='margin-left:.25in;text-align:justify'><span
style='font-size:4.0pt'>&nbsp;</span></p>

<p class=MsoNormal style='margin-left:.5in'>Ann Shockey, born Sept. 19, 1941<span
style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'> 2,12b,71a</span>, who married Richard Pulliam<span
style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'> 71a</span>,</p>

<p class=MsoNormal style='margin-left:.5in'>David Shockey, born Jan. 4, 1944<span
style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'> 2,12b,71a</span> who married Patricia McGinley<span
style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'> 71a</span>, and </p>

<p class=MsoNormal style='margin-left:.5in'>Bonnie Shockey, born Aug. 8, 1948<span
style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'> 2,12b,71a</span>.</p>

<p class=MsoNormal style='margin-left:.5in'><span style='font-size:4.0pt'>&nbsp;</span></p>

<p class=MsoNormal style='margin-left:.25in;text-align:justify'>Karl Dietle,
son of John Dietle and Bertha (Steinley) Dietle, married Anna<span
style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'>95,432 </span>Catherine<span style='font-size:8.0pt;font-family:
"Helvetica",sans-serif;position:relative;top:-3.0pt'> 53</span> or Catharine<span
style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'>2,131a</span> Siegner<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'> 53,131a</span>, daughter of John Frederick
Siegner<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'>131a </span>(b. 1878<span style='font-size:8.0pt;
font-family:"Helvetica",sans-serif;position:relative;top:-3.0pt'>432</span> ,
d. 1955<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'>432</span> ) and Mary Seiler<span
style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'> 131a</span> d. 1968<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'>432</span> ).  Catharine<a href="#_ftn3"
name="_ftnref3" title=""><span class=MsoFootnoteReference><span
style='font-size:8.0pt'>*</span></span></a> was b. Dec. 14, 1919<span
style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'>131a</span>. </p>

<p class=MsoNormal style='margin-left:.25in;text-align:justify'><span
style='font-size:4.0pt'>&nbsp;</span></p>

<p class=MsoNormal style='margin-left:.25in;text-align:justify'>The Somerset
Co. deed index <span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'>95 </span>lists a real estate transaction between
Grantor John M. Dietle and Grantees Karl F. &amp; Anna Catherine Dietle in
Greenville Twp. on Nov. 20, 1940. </p>

<p class=MsoNormal style='margin-left:.25in;text-align:justify'><span
style='font-size:4.0pt'>&nbsp;</span></p>

<p class=MsoNormal style='margin-left:.25in;text-align:justify'>Karl was a
Farmer<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'> 53</span>.  He sold his farm sometime in middle
age and went to New Jersey to work on a large farm there<span style='font-size:
8.0pt;font-family:"Helvetica",sans-serif;position:relative;top:-3.0pt'> 53</span>.
Grandma Dietle s notebook gives their address as Riverton, NJ<span
style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'> 132</span>. Karl was not listed as a survivor in his mother s 1969
obituary. Karl and Catherine had the following children<span style='font-size:
8.0pt;font-family:"Helvetica",sans-serif;position:relative;top:-3.0pt'>
2,12b,71a</span>: </p>

<p class=MsoNormal style='margin-left:.25in;text-align:justify'><span
style='font-size:4.0pt'>&nbsp;</span></p>

<p class=MsoNormal style='margin-left:.5in'>Mary Ann Dietle, born Oct. 10,
1941,</p>

<p class=MsoNormal style='margin-left:.5in'>Nancy Dietle, born Oct. 2, 1942,
and</p>

<p class=MsoNormal style='margin-left:.5in'>Sally Dietle, born Nov. 16, 1948.</p>

<p class=MsoNormal style='margin-left:.5in'><span style='font-size:4.0pt'>&nbsp;</span></p>

<p class=MsoNormal style='margin-left:.5in'>Mary Ann Dietle, daughter of Karl
Dietle and Catharine (Seigner) Dietle, married William Beck<span
style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'> 2,12b,71a</span>. They had the following children: </p>

<p class=MsoNormal style='margin-left:.5in'><span style='font-size:4.0pt'>&nbsp;</span></p>

<p class=MsoNormal style='margin-left:.75in'>Susan Renay<span style='font-size:
8.0pt;font-family:"Helvetica",sans-serif;position:relative;top:-3.0pt'>71a</span>  Susie <span
style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'>2,12b,131b</span> Beck, born July 23<span style='font-size:8.0pt;
font-family:"Helvetica",sans-serif;position:relative;top:-3.0pt'>2,12b,131b</span> or
24<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:
relative;top:-3.0pt'>71a</span>, 1961<span style='font-size:8.0pt;font-family:
"Helvetica",sans-serif;position:relative;top:-3.0pt'>2</span>, and</p>

<p class=MsoNormal style='margin-left:.75in'>William Karl<span
style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'>71a</span>  Billy <span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'>2,12b,131b</span> Beck, born June 19, 1962<span
style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'>2,12b,71a,131b</span>.</p>

<p class=MsoNormal style='margin-left:.75in'><span style='font-size:4.0pt'>&nbsp;</span></p>

<p class=MsoNormal style='margin-left:.5in'>Nancy Dietle, daughter of Karl
Dietle and Catherine (Seigner Dietle), married Robert M. Wence<span
style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'> 71a</span>.</p>

<p class=MsoNormal style='margin-left:.5in'><span style='font-size:4.0pt'>&nbsp;</span></p>

<p class=MsoNormal style='margin-left:.25in;text-align:justify'>Hubert A.
Dietle, son of John Dietle and Bertha (Steinley) Dietle, died at a young age<a
href="#_ftn4" name="_ftnref4" title=""><span class=MsoFootnoteReference><span
style='font-size:8.0pt'>**</span></span></a><span style='font-size:8.0pt;
position:relative;top:-3.0pt'> </span>. Hubert, his brother Karl, and his
sister Dorthy all attended the Spruce Dale School in 1930, along with Alverta
Meese<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'>349</span>, daughter of Emma Dietle and Reid
Meese. The teacher that year was Emma (McKenzie) Murray<span style='font-size:
8.0pt;font-family:"Helvetica",sans-serif;position:relative;top:-3.0pt'>349</span>.
A Spruce Dale school photo from 1930 shows 21 children of all ages, including
Hubert<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'>349</span>.</p>

<p class=MsoNormal align=center style='text-align:center'><b><span
style='font-size:12.0pt'>&nbsp;</span></b></p>

<p class=MsoNormal align=center style='text-align:center'><b><span
style='font-size:12.0pt'>Harry Dietle</span></b></p>

<p class=MsoNormal align=center style='text-align:center'><b><span
style='font-size:4.0pt'>&nbsp;</span></b></p>

<p class=MsoNormal align=center style='text-align:center'><b><span
style='font-size:4.0pt'>&nbsp;</span></b></p>

<p class=MsoNormal style='text-align:justify'>Harry Dietle, son of Adam Dietle
and Susan (Werner) Dietle, was engaged to be married<span style='font-size:
8.0pt;font-family:"Helvetica",sans-serif;position:relative;top:-3.0pt'> 24</span> at
the time of his untimely death at age 32<span style='font-size:8.0pt;
font-family:"Helvetica",sans-serif;position:relative;top:-3.0pt'> 77,297</span>.
He was a farmer, and died on Nov. 5, 1926<span style='font-size:8.0pt;
font-family:"Helvetica",sans-serif;position:relative;top:-3.0pt'>12b,57 </span>in
a horrible accident at a sawmill which he and his brother Irvin owned<span
style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'> 53</span>. Their business was known as the Dietle Bros. Lumber
Company<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'> 77,297</span>. They had recently finished sawing
at what was known as the Ephriam Geiger farm<span style='font-size:8.0pt;
font-family:"Helvetica",sans-serif;position:relative;top:-3.0pt'> 77,297</span> which
Harry owned<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'>341</span>, and had moved the steam driven mill
to the Joseph Bittner tract<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'>297</span>. Harry was working in the pit under
the mill at about 5:30 PM on a Friday, and was apparently drawn into the
revolving saw blade by the  drag  which carried the sawdust to the sawdust pile<span
style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'> 77,297</span>. He was in the pit to apply grease and oil, and the
accident split his head in two<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'>297</span>. He was a member of the Church of the
Brethern at the time of his death<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'> 77,297</span>. He is buried at the Greenville
Union Cemetery<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'> 46,57,77,297</span>. The funeral services were
conducted by The Rev. Samuel Sigler of Salisbury and the Rev. T. Rodney Coffman
of Meyersdale<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'> 77</span>. John and Irvin Deitle were the
administrators of Harry s estate<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'>388</span>. Total cost of the funeral was $495.75<span
style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'>388</span>. The appraised value of Harry s estate was $2,600 for
real estate and $2189.27 personal property, less debts of $2802.62<span
style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'>394</span>.</p>

<p class=MsoNormal style='text-align:justify'><span style='font-size:4.0pt'>&nbsp;</span></p>

<p class=MsoNormal align=center style='text-align:center'><img width=158
height=238 src="Chapter-7_files/image004.jpg"></p>

<p class=MsoNormal align=center style='margin-right:.25in;text-align:center'><span
style='font-size:4.0pt;font-family:"Helvetica",sans-serif'>&nbsp;</span></p>

<p class=MsoNormal align=center style='text-align:center'><span
style='font-size:9.0pt;font-family:"Helvetica",sans-serif'>Harry Dietle</span></p>

<p class=MsoNormal style='text-align:justify'>&nbsp;</p>

<p class=MsoNormal style='text-align:justify'><span style='font-size:4.0pt'>&nbsp;</span></p>

<p class=MsoNormal style='text-align:justify'><span style='font-size:4.0pt'>&nbsp;</span></p>

<p class=MsoNormal style='text-align:justify'>In 1920 Harry was living at the
farm of Mary Geiger in Larimer Twp.<span style='font-size:8.0pt;font-family:
"Helvetica",sans-serif;position:relative;top:-3.0pt'> 48</span>. On June 19,
1920 Harry bought the following items from Mary Geiger for $800: 2 horses, 3
cows, 3 hogs, lot of chickens, 1 mowing machine, plows, harrows, wagons, cream
separator, and farm implements and tools<span style='font-size:8.0pt;
font-family:"Helvetica",sans-serif;position:relative;top:-3.0pt'>338</span>. He
eventually bought the farm from her for $2,500.00<span style='font-size:8.0pt;
font-family:"Helvetica",sans-serif;position:relative;top:-3.0pt'>341</span>.
She conveyed the property to him in a deed dated January 7, 1925<span
style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'>200,341</span> which let her use the house jointly with Harry as
long as she lived<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'>341</span>. This deed is recorded in the Somerset
Record Book of Deeds, Vol. 263, page 571<span style='font-size:8.0pt;
font-family:"Helvetica",sans-serif;position:relative;top:-3.0pt'>200</span>.
The text of the deed, which lists several previous owners, is included in
Appendix B. The deed transferred a 98 acre+ tract and a 12 acre+ tract. This
farm (The Ephriam Geiger farm) eventually became the home of our Grandfather
Irvin H. Dietle. </p>

<p class=MsoNormal style='text-align:justify'>&nbsp;</p>

<p class=MsoNormal align=center style='text-align:center'><img width=493
height=288 src="Chapter-7_files/image005.jpg"></p>

<p class=MsoNormal align=center style='text-align:center'><span
style='font-size:4.0pt;font-family:"Helvetica",sans-serif'>&nbsp;</span></p>

<p class=MsoNormal align=center style='text-align:center'><span
style='font-size:9.0pt;font-family:"Helvetica",sans-serif'>The sawmill of
brothers Irvin &amp; Harry Dietle</span></p>

<p class=MsoNormal align=center style='text-align:center'><span
style='font-size:9.0pt;font-family:"Helvetica",sans-serif'>(Courtesy of Ralph
Dietle from Irvin Dietle, Sr. papers)</span></p>

<p class=MsoNormal style='text-align:justify'>&nbsp;</p>

<p class=MsoNormal align=center style='text-align:center'><b><span
style='font-size:12.0pt'>&nbsp;</span></b></p>

<p class=MsoNormal align=center style='text-align:center'><b><span
style='font-size:12.0pt'>&nbsp;</span></b></p>

<p class=MsoNormal align=center style='text-align:center'><b><span
style='font-size:12.0pt'>Simon Albert Dietle</span></b></p>

<p class=MsoNormal align=center style='text-align:center'><b><span
style='font-size:4.0pt'>&nbsp;</span></b></p>

<p class=MsoNormal style='text-align:justify'>Simon Albert Dietle, son of Adam
Dietle and Susan (Werner) Dietle, married Ruth<span style='font-size:8.0pt;
font-family:"Helvetica",sans-serif;position:relative;top:-3.0pt'>2,50</span> Ada<span
style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'>50</span> Arklie<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'> 2,50</span>, who was born on Dec. 3, 1897<span
style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'> 50</span> and died on May 24, 1945<span style='font-size:8.0pt;
font-family:"Helvetica",sans-serif;position:relative;top:-3.0pt'> 2,12b,71a</span> or
May 25, 1945<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'>187</span>. Ruth s father Eugene<span
style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'>50</span>  Gene <span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'>177</span> Arklie<span style='font-size:8.0pt;
font-family:"Helvetica",sans-serif;position:relative;top:-3.0pt'>50</span> was
born in 1873 and died in 1948, and her mother Magie (sic) Cline was born in
1874 and died in 1932<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'> 50</span>. Simon was a Farmer<span
style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'> 50,53</span>, and later in life he worked at a sawmill in
Meyersdale<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'>187</span>. Simon was also a member of the
Greenville Lutheran Church<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'> 53</span>. Simon and Ruth s daughter Catherine
remembers them as hard working, and good parents<span style='font-size:8.0pt;
font-family:"Helvetica",sans-serif;position:relative;top:-3.0pt'> 136</span>.
Dad recalls Simon as a likable fellow who liked to hunt<span style='font-size:
8.0pt;font-family:"Helvetica",sans-serif;position:relative;top:-3.0pt'> 53</span>.
A number of Dietle family members went hunting together with Simon, including
(in different combinations) Sylvester, Dad, Bud, June, John, Karl, and Grandpap<span
style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'> 53</span>. Dad also recalls that Simon was very good at playing
the violin, and liked what would now be called Country-Western music<span
style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'> 135</span>. Simon s daughter Ada recalls that Simon frequently
played the violin<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'>187</span>. This love of music has been noted in
3 subsequent generations.</p>

<p class=MsoNormal style='text-align:justify'><span style='font-size:4.0pt'>&nbsp;</span></p>

<p class=MsoNormal style='text-align:justify'>Simon died intestate<span
style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'>335</span> and is buried at the Greenville Lutheran Church,
Pocahontas, PA<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'> 50,164,187,315</span>, along with his wife Ruth<span
style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'>164,187,315</span>. The 1920 census lists Simon, age 23, as living
in Greenville Twp. as a Farm Laborer with his wife Ruth, daughter Catharine
(sic) Susan Dietle, and son Sylvester S. Dietle<span style='font-size:8.0pt;
font-family:"Helvetica",sans-serif;position:relative;top:-3.0pt'> 54</span>.
The 1920 census also indicates that Ruth was born in Kansas, but both of her
parents were born in PA. </p>

<p class=MsoNormal style='text-align:justify'><span style='font-size:4.0pt'>&nbsp;</span></p>

<p class=MsoNormal style='text-align:justify'>Simon and Ruth lived between
Greenville and Sand Patch<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'> 53</span>, about 8 miles away from Grandpa Irvin
H. Dietle<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'> 23</span>, and often came to visit Grandpa s
home when our father Roy Dietle was still a youth<span style='font-size:8.0pt;
font-family:"Helvetica",sans-serif;position:relative;top:-3.0pt'> 23</span>.
Simon s daughter Ada recalls that visiting the homes of their Uncles was one of
the things that they did for pleasure after church on Sundays<span
style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'>187</span>. They alternated, going to Uncle Irv s one week, Uncle
John s the next, and so forth. Ada also recalls that farming took a lot of
their time, and didn t leave a lot of time for recreation<span
style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'>187</span>. She said  We got up with the chickens, and went to bed
with the chickens <span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'>187</span>. There weren t a lot of modern day
conveniences on the farm either. Ada recalls that when she was growing up, they
had no electricity, no indoor plumbing, and no running water<span
style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'>187</span>. </p>

<p class=MsoNormal style='text-align:justify'>&nbsp;</p>

<p class=MsoNormal align=center style='margin-right:.25in;text-align:center'><img
width=456 height=336 src="Chapter-7_files/image006.gif"></p>

<p class=MsoNormal align=center style='margin-right:.25in;text-align:center'><span
style='font-size:4.0pt;font-family:"Helvetica",sans-serif'>&nbsp;</span></p>

<p class=MsoNormal align=center style='text-align:center'><span
style='font-size:9.0pt;font-family:"Helvetica",sans-serif'>Simon Dietle &amp;
his wife Ruth (Arklie) Dietle</span></p>

<p class=MsoNormal style='text-align:justify'><span style='font-size:4.0pt'>&nbsp;</span></p>

<p class=MsoNormal style='text-align:justify'><span style='font-size:4.0pt'>&nbsp;</span></p>

<p class=MsoNormal style='text-align:justify'><span style='font-size:4.0pt'>&nbsp;</span></p>

<p class=MsoNormal style='text-align:justify'>The Somerset Co. deed index <span
style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'>95 </span>lists the following real estate transactions which
involved Simon:</p>

<p class=MsoNormal style='text-align:justify'><span style='font-size:4.0pt'>&nbsp;</span></p>

<p class=MsoNormal style='margin-left:.25in;text-align:justify'>Grantor Simon
Dietle to Grantee Clarence A. Obringer on May 1, 1946 in Greenville, and</p>

<p class=MsoNormal style='margin-left:.25in;text-align:justify'>Grantor Simon
A. Dietle to Grantee ux Susan Dietle on Dec. 30, 1931 in Greenville Twp. </p>

<p class=MsoNormal style='margin-left:.25in;text-align:justify'><span
style='font-size:4.0pt'>&nbsp;</span></p>

<p class=MsoNormal style='margin-left:.25in;text-align:justify'>Clarence
Obringer was from Pittsburgh, and lived back on the neighboring farm<span
style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'>187</span>, and was no relation to the family<span
style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'>187</span>.</p>

<p class=MsoNormal style='margin-left:.25in;text-align:justify'><span
style='font-size:4.0pt'>&nbsp;</span></p>

<p class=MsoNormal style='text-align:justify'>Simon and Ruth had the following
children: </p>

<p class=MsoNormal style='text-align:justify'><span style='font-size:4.0pt'>&nbsp;</span></p>

<p class=MsoNormal style='margin-left:.25in'>Catherine<span style='font-size:

"Helvetica",sans-serif;position:relative;top:-3.0pt'> 79</span>. Both Sylvester<span

font-family:"Helvetica",sans-serif;position:relative;top:-3.0pt'> 79</span>.

position:relative;top:-3.0pt'>295</span>.</p>

<p class=MsoNormal style='margin-left:.25in;text-align:justify'>Bruce Dietle,
son of Simon Dietle and Ruth (Arklie) Dietle, was a close friend of our Uncle
 Bud  Dietle at one time<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'> 23</span>. Dad recalls that Bruce was an
energetic and entertaining talker; the type of person who is the life of the
party<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'>135</span>.</p>

<p class=MsoNormal style='margin-left:.25in;text-align:justify'><span
style='font-size:4.0pt'>&nbsp;</span></p>

<p class=MsoNormal style='margin-left:.25in;text-align:justify'>Bruce was in
the Armed forces in WW-II<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'> 23,187</span>. At least part of his military
service involved the use of gliders<span style='font-size:8.0pt;font-family:
"Helvetica",sans-serif;position:relative;top:-3.0pt'> 23</span>. He went into
the service with the 17th Airborne in 1942, and was discharged from the 82nd
Airborne Troopers in 1946<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'>50</span>. He was still in Germany when his
mother died, and was not able to come home for the funeral<span
style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'>187</span>.</p>

<p class=MsoNormal style='margin-left:.25in;text-align:justify'><span
style='font-size:4.0pt'>&nbsp;</span></p>

<p class=MsoNormal style='margin-left:.25in;text-align:justify'>Dad recalls
that at one time Bruce owned his own business, and did back hoe and bulldozer
work<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:
relative;top:-3.0pt'> 53</span>. Bruce married Susan<span style='font-size:
8.0pt;font-family:"Helvetica",sans-serif;position:relative;top:-3.0pt'>2,50,131a,315</span> F.<span
style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'>315</span> Belcher<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'> 2,50,131a</span>, who was the daughter of Frank
Belcher and his wife Elizabeth (Bisbing) Belcher<span style='font-size:8.0pt;
font-family:"Helvetica",sans-serif;position:relative;top:-3.0pt'>164</span>.
Susan was born on November 12, 1927<span style='font-size:8.0pt;font-family:
"Helvetica",sans-serif;position:relative;top:-3.0pt'>50,164,315</span> and died
Oct. 10, 1990<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'>71b,164,315</span>. She is buried at the
Greenville Union Cemetery<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'>315</span>. Joyce Hertsch reports that Bruce
enjoys country-western dancing, and participates in it frequently<span
style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'>137</span>. Joyce recalls that Susan lived her life for her
children, and also enjoyed the outdoors, working with her plants and flowers<span
style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'>137</span>. Susan s son Daryl also recalls Susan s love of flower
gardening and recalls that she also had an interest in hummingbirds, and
enjoyed feeding and observing them<span style='font-size:8.0pt;font-family:
"Helvetica",sans-serif;position:relative;top:-3.0pt'> 177</span>. Susan also
worked summers at a fruit and vegetable stand that was near their home<span
style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'> 177</span>. Bruce and Susan had the following children<span
style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'>12b,50</span>: </p>

<p class=MsoNormal style='margin-left:.5in'><span style='font-size:4.0pt'>&nbsp;</span></p>

<p class=MsoNormal style='margin-left:.5in;text-align:justify'>Daryl Dietle,
son of Bruce Dietle and Susan (Belcher) Dietle, married Beverly<span
style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'>177</span> Jane<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'>50,177</span> Miller<span style='font-size:8.0pt;
font-family:"Helvetica",sans-serif;position:relative;top:-3.0pt'>50,177</span>.
Jane, who was born July 10, 1952 in Baltimore, MD is the daughter of Desmond
Dean Miller and Elizabeth Jane (Sellers) Miller<span style='font-size:8.0pt;
font-family:"Helvetica",sans-serif;position:relative;top:-3.0pt'> 177</span>.
Before their children were born, Jane worked at a bank, but now (1994) she is a
Housewife, and is home-schooling her children<span style='font-size:8.0pt;
font-family:"Helvetica",sans-serif;position:relative;top:-3.0pt'>177</span>.
Daryl runs heavy equipment<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'>177</span> in a landfill<span style='font-size:
8.0pt;font-family:"Helvetica",sans-serif;position:relative;top:-3.0pt'> 137,177</span> for
Baltimore County<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'> 177</span>. He and his wife are members of the
Jehovah s Witness Church<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'>137</span>. They live on Jane s Grandfather s
farm in the country, near Kingsville, MD, which borders a State Park<span
style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'> 177</span>. Their residence is fairly close to Daryl s father s
home, and about 20 miles north of Baltimore<span style='font-size:8.0pt;
font-family:"Helvetica",sans-serif;position:relative;top:-3.0pt'> 177</span>.
Daryl was in the Army, and was stationed in Augsburg, Germany in 1968<span
style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'> 177</span>. </p>

<p class=MsoNormal style='margin-left:.5in;text-align:justify'><span
style='font-size:4.0pt'>&nbsp;</span></p>

<p class=MsoNormal style='margin-left:.5in;text-align:justify'>Daryl s main
interest is music<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'>177</span>. He plays fiddle and guitar, and has
his Grandfather Simon s fiddle<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'>177</span>. He likes bluegrass and country music,
and plays at the Deer Creek Fiddler s Convention<span style='font-size:8.0pt;
font-family:"Helvetica",sans-serif;position:relative;top:-3.0pt'>177</span>.
Both of his children like music too<span style='font-size:8.0pt;font-family:
"Helvetica",sans-serif;position:relative;top:-3.0pt'>177</span>. Daryl also
likes landscaping, fishing, and riding a Honda  4-wheeler  all terrain vehicle
off-road. He operates a part-time business with a dump truck and front-end
loader, and sells topsoil, mulch and firewood. His wife Jane enjoys
photography, flower gardening, hummingbirds, and travel.</p>

<p class=MsoNormal style='margin-left:.75in;text-align:justify'>Travis Dietle,

and his father is teaching the guitar to him<span style='font-size:8.0pt;
font-family:"Helvetica",sans-serif;position:relative;top:-3.0pt'>177</span>. He

bicycling, roller blading, bass fishing, baseball, gymnastics, and other
sports. </p>

<p class=MsoNormal style='margin-left:.75in;text-align:justify'><span
style='font-size:4.0pt'>&nbsp;</span></p>

<p class=MsoNormal style='margin-left:.75in;text-align:justify'>Kelsey Dietle,

lessons<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'>177</span>. She likes country music, particularly
Reba McIntire and Dolly Parton<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'>177</span>. She (1994) enjoys roller blading,

style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'>177</span>.</p>

style='font-size:4.0pt'>&nbsp;</span></p>

<p class=MsoNormal style='margin-left:.5in;text-align:justify'>Marlin Dietle,

a son named Brian Dale Dietle<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;

position:relative;top:-3.0pt'>137</span>, and is an Auto Mechanic<span

top:-3.0pt'>137,187</span>. </p>

<p class=MsoNormal style='margin-left:.5in;text-align:justify'><span
style='font-size:4.0pt'>&nbsp;</span></p>

<p class=MsoNormal style='margin-left:.5in;text-align:justify'>Melissa Dietle,

top:-3.0pt'>50</span> who is a Machinist<span style='font-size:8.0pt;

relative;top:-3.0pt'>50</span>. She is (1994) working for Nation s Bank<span

top:-3.0pt'> 137</span> or First National Bank<span style='font-size:8.0pt;
font-family:"Helvetica",sans-serif;position:relative;top:-3.0pt'> 177</span>.

8.0pt;font-family:"Helvetica",sans-serif;position:relative;top:-3.0pt'>50</span>.

position:relative;top:-3.0pt'>187 </span>degree in Horticulture<span
style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;

font-family:"Helvetica",sans-serif;position:relative;top:-3.0pt'>177</span> and

"Helvetica",sans-serif;position:relative;top:-3.0pt'>177</span>. She had a
Baldwin, MD address in 1994<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'> 164</span>.</p>

<p class=MsoNormal style='margin-left:.25in;text-align:justify'>Ada Ruth Dietle,

style='font-size:8.0pt'>*</span></span></a> <span style='font-size:8.0pt;

font-family:"Helvetica",sans-serif;position:relative;top:-3.0pt'>53</span> in
1993. Grandma Dietle s address book gave their address as Perry Hall, MD<span
style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'>53</span>. They were still residing in Perry Hall in 1994<span
style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'>187</span>. Ada Ruth s name is based upon her mother s name Ruth
Ada, but she is also named after a town in Kansas named Ada, where relatives
reportedly still live<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'>137.</span> </p>

<p class=MsoNormal style='margin-left:.25in;text-align:justify'><span
style='font-size:4.0pt'>&nbsp;</span></p>

<p class=MsoNormal style='margin-left:.25in;text-align:justify'>Before she was
married, Ada moved to MD to seek employment because there wasn t much work
around home in PA<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'>137</span>. When she first moved to MD, she
worked for a box and container factory<span style='font-size:8.0pt;font-family:
"Helvetica",sans-serif;position:relative;top:-3.0pt'>137</span>. Most of her
working career has been with box and container factories, but she also worked
as a Waitress when she was first married<span style='font-size:8.0pt;
font-family:"Helvetica",sans-serif;position:relative;top:-3.0pt'>137</span>.
According to her daughter Joyce, some of Ada s hobbies are following the
horoscopes and the daily lottery<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'>137</span>. When I interviewed Ada in the spring
of 1994, she reported that she had just retired from MacMillan and Bloedell, a
corrugated box company<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'>187</span>.</p>

<p class=MsoNormal style='margin-left:.25in;text-align:justify'><span
style='font-size:4.0pt'>&nbsp;</span></p>

<p class=MsoNormal style='margin-left:.25in;text-align:justify'>John Goodwin,
the son of John and Teresa Goodwin<span style='font-size:8.0pt;font-family:
"Helvetica",sans-serif;position:relative;top:-3.0pt'>187</span>, was born on
October 14, 1928<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'>137</span>. He was the only son in a family of 8
sisters, and had to help support the family after his father died when he was
in the second grade. John worked in the Esskay Butcher Plant as a Butcher, and
also worked as a Mechanic in a gas station in Hollandtown<span
style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'>137</span>. His working career ended when he was about age 40/42
when he was badly crushed in a near fatal automobile accident<span
style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'>137</span>. He likes to work with his hands mechanically, and
presently (1994) does small engine repair on lawn mowers, roto-tillers, etc. </p>

<p class=MsoNormal align=center style='text-align:center'><b><span
style='font-size:12.0pt'>Clara Belle Dietle</span></b></p>

<p class=MsoNormal align=center style='text-align:center'><b><span
style='font-size:4.0pt'>&nbsp;</span></b></p>

<p class=MsoNormal style='text-align:justify'>Clara Belle Dietle, daughter of
Adam Dietle and Susan (Werner) Dietle, married Harvey<span style='font-size:
8.0pt;font-family:"Helvetica",sans-serif;position:relative;top:-3.0pt'>2,72</span>  Harve <span
style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'>23</span> Alfred<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'>72</span> Geiger<span style='font-size:8.0pt;
font-family:"Helvetica",sans-serif;position:relative;top:-3.0pt'>2,72</span>,
who was born on Dec. 26, 1897<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'>72</span> and died Oct. 21, 1981<span
style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'>72</span>. Harvey was the son of Ezra Geiger and his wife Martha
(Lowry) Geiger, and is related to our mother and Lerene Viola (Geiger) Murray
through the Geiger family. Ezra and Martha are buried in the cemetery of the
White Oak Mt. Carmel Lutheran Church<span style='font-size:8.0pt;font-family:
"Helvetica",sans-serif;position:relative;top:-3.0pt'>312</span>.</p>

<p class=MsoNormal style='text-align:justify'>&nbsp;</p>

height=498 src="Chapter-7_files/image010.jpg"></p>

style='font-size:4.0pt;font-family:"Helvetica",sans-serif'>&nbsp;</span></p>

<p class=MsoNormal align=center style='text-align:center'><span
style='font-size:9.0pt;font-family:"Helvetica",sans-serif'>Harvey Geiger, his
wife Clara and daughter Betty.</span></p>

<p class=MsoNormal align=center style='text-align:center'><span
style='font-size:9.0pt;font-family:"Helvetica",sans-serif'>(Courtesy of Ralph
Dietle from Irvin Dietle, Sr. papers)</span></p>

<p class=MsoNormal style='text-align:justify'><span style='font-size:4.0pt'>&nbsp;</span></p>

<p class=MsoNormal style='text-align:justify'><span style='font-size:4.0pt'>&nbsp;</span></p>

<p class=MsoNormal style='text-align:justify'>Our father recalls that Clara
Belle was a very quiet person<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'>53</span>, as does Clara s son Harvey Geiger, Jr.<span
style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'>106</span>. Harvey, on the other hand, was talkative by nature<span
style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'>106</span>. Clara and Harvey lived and farmed near Wittenburg, and
attended the White Oak Lutheran Church<span style='font-size:8.0pt;font-family:
"Helvetica",sans-serif;position:relative;top:-3.0pt'>53</span>. Harvey did a
lot of huckstering<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'>53</span>. Every Friday he had his route, selling
butter, eggs, meat and produce<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'>53</span>. Clara collected beautiful glassware,
dishes, etc<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'>70</span>. According to Grandma Dietle s
notebook, Clara broke her leg or hip on Sept. 4, 1971<span style='font-size:
8.0pt;font-family:"Helvetica",sans-serif;position:relative;top:-3.0pt'>132</span>.
She is buried at the White Oak Cemetery<span style='font-size:8.0pt;font-family:
"Helvetica",sans-serif;position:relative;top:-3.0pt'>242,256</span>. In her
father s 1930 obituary, Clara was residing at Corriganville, MD, and in her
mother s 1932 obituary, Clara was also said to be living in Maryland<span
style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'>267</span>. Clara and Harvey had the following children: </p>

<p class=MsoNormal style='text-align:justify'><span style='font-size:4.0pt'>&nbsp;</span></p>

<p class=MsoNormal style='margin-left:.25in'>Betty Geiger<span
style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'>2,12b,131a</span>, born July 8, 1926<span style='font-size:8.0pt;
font-family:"Helvetica",sans-serif;position:relative;top:-3.0pt'>2,12b,71a</span>,
died Jan. 10, 1993<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'>70,71b</span>, and</p>

font-family:"Helvetica",sans-serif;position:relative;top:-3.0pt'>2,12b,71a</span>.</p>

style='font-size:4.0pt'>&nbsp;</span></b></p>

<p class=MsoNormal style='text-align:justify'>Lloyd Mahlon Dietle, son of Adam
Dietle and Susan (Werner) Dietle, married Annie Mildred Miller (a sister of
Alma Catharine (Miller) Dietle) on October 9, 1927<span style='font-size:8.0pt;
font-family:"Helvetica",sans-serif;position:relative;top:-3.0pt'>9,14</span>.
Annie Mildred Miller was born on October 2<span style='font-size:8.0pt;
font-family:"Helvetica",sans-serif;position:relative;top:-3.0pt'>9,14,132</span>,
1906<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:
relative;top:-3.0pt'>9,14,132,315</span>. She is known as Mildred<span
style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'>2</span>. Lloyd and Mildred farmed in Greenville Township, Somerset
Co.<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:
relative;top:-3.0pt'>9</span> on his father Adam s farm<span style='font-size:
8.0pt;font-family:"Helvetica",sans-serif;position:relative;top:-3.0pt'>53</span>.
They had a daughter Agnes Marie Dietle who was born on April 24, 1930<span
style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'>9,14,315</span> or March 24, 1930<span style='font-size:8.0pt;
font-family:"Helvetica",sans-serif;position:relative;top:-3.0pt'>2,71a</span> and
died on March 7, 1936<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'>14 </span>or March 9, 1936<span style='font-size:
8.0pt;font-family:"Helvetica",sans-serif;position:relative;top:-3.0pt'>2,9,71a,315</span> of
appendicitis<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'>9</span>. Lloyd died intestate<span
style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'>335</span> of pneumonia<span style='font-size:8.0pt;font-family:
"Helvetica",sans-serif;position:relative;top:-3.0pt'>9</span> on November 11<span
style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'>9</span>, 1931<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'>9,315</span> and buried at the Greenville Union
Cemetery<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'>46,57,315</span>. Agnes Marie is also buried at
the Greenville Union Cemetery<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'>315</span>.</p>

<p class=MsoNormal style='text-align:justify'><span style='font-size:4.0pt'>&nbsp;</span></p>

<p class=MsoNormal style='text-align:justify'>In an oral interview, our father
Roy Dietle recalled that after Lloyd s father Adam Dietle died, Lloyd ran
Adam s farm<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'>49</span>. After Lloyd died, John Dietle owned
the farm, and eventually sold it to Lawrence Jackson and Velma (Steinly)
Jackson<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'>49</span>. (Velma, who was the daughter of Sadie
(Dietle) Steinly, was John s niece<span style='font-size:8.0pt;font-family:
"Helvetica",sans-serif;position:relative;top:-3.0pt'>49</span>.) In 1993 the
farm was being run by Lawrence s son David Jackson<span style='font-size:8.0pt;
font-family:"Helvetica",sans-serif;position:relative;top:-3.0pt'>49</span> as a
dairy farming operation<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'>70</span>.</p>

<p class=MsoNormal style='text-align:justify'>&nbsp;</p>

<p class=MsoNormal style='text-align:justify'><span style='font-size:4.0pt'>&nbsp;</span></p>

<p class=MsoNormal style='text-align:justify'>The Somerset C. Deed Index<span
style='font-size:8.0pt;font-family:"Helvetica",sans-serif;position:relative;
top:-3.0pt'>95</span> shows that a piece of ground in Greenville Twp. changed
hands between Grantor Adam Dietle and Grantees Lloyd and Anna M. Dietle on Nov.
8, 1927, shortly after Lloyd and Mildred s marriage. This was evidently the
sale of Adam s home place. The Somerset C. Deed Index<span style='font-size:
8.0pt;font-family:"Helvetica",sans-serif;position:relative;top:-3.0pt'>95</span> also
shows a transaction in Greenville Twp. on Dec. 16, 1931 (shortly after Lloyd s
death) between Grantor Anna M. Dietle and Grantees John M. and Bertha N.
Dietle. Another transaction between Grantor Lloyd M. Dietle and Grantees John
M. and Bertha N. Dietle occurred in Greenville Twp. on Oct. 5, 1926.</p>

<p class=MsoNormal style='text-align:justify'><span style='font-size:4.0pt'>&nbsp;</span></p>

<p class=MsoNormal style='text-align:justify'>Mildred spent most of her
lifetime living in Greenville Twp. except for a short time when she lived with
her sister and brother-in-law Vaughn and Maggie Williams of Everett PA, which
is in Bedford County<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'>64</span>. During this time her little girl Agnes
Marie became ill with appendicitis and passed away in the Bedford Memorial
Hospital<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'>64</span>. After this, Mildred came home and
lived with her parents on the Harvey Miller farm<span style='font-size:8.0pt;
font-family:"Helvetica",sans-serif;position:relative;top:-3.0pt'>64</span> east
of Pocahontas on the Finzel road<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'>307</span>. Later she worked and retired from the
Meyersdale shirt factory, and eventually built a home on a portion of her
father s farm where she was living in 1993<span style='font-size:8.0pt;
font-family:"Helvetica",sans-serif;position:relative;top:-3.0pt'>64</span>. She
was living in this home already by 1963, because it was mentioned in a Miller
genealogy printed in that year<span style='font-size:8.0pt;font-family:"Helvetica",sans-serif;
position:relative;top:-3.0pt'>9</span> which also mentioned that she was
working for the Meyersdale Manufacturing Co.. She moved into a nursing home in
1995, and her household, which contained some of her parent s furniture, was
auctioned off in the summer of 1995. </p>

<p class=MsoNormal style='text-align:justify'>&nbsp;</p>
